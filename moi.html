<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon planning F890</title>
<meta name="theme-color" content="#0d2240"><link rel="manifest" href="manifest-moi.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Espace collaborateur : une colonne, pensée pour le téléphone. Orange enseigne, bleu nuit. */
:root{--bg:#f4f6f9;--surface:#fff;--surface-2:#eef1f6;--line:#d8dee8;--fg:#16202e;--muted:#5d6b7e;--navy:#0d2240;--navy-fg:#fff;--accent:#e8620f;--accent-fg:#fff;--ok:#17803d;--ok-soft:#dcf3e4;--warn:#b45309;--warn-soft:#fdf0d5;--bad:#c42222;--bad-soft:#fde4e4;--sel:#1d5fd1;--sel-soft:#e3ecfc;
--font-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--font-display:"Barlow Condensed","Barlow",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c121c;--surface:#131b28;--surface-2:#1a2434;--line:#2a3649;--fg:#e6ebf3;--muted:#93a1b5;--navy:#1b3560;--accent:#ff7a2b;--accent-fg:#1a0d04;--ok:#4fd27f;--ok-soft:#14301f;--warn:#f2b052;--warn-soft:#352812;--bad:#ff7676;--bad-soft:#3a1717;--sel:#6aa1ff;--sel-soft:#1b2d4f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c121c;--surface:#131b28;--surface-2:#1a2434;--line:#2a3649;--fg:#e6ebf3;--muted:#93a1b5;--navy:#1b3560;--accent:#ff7a2b;--accent-fg:#1a0d04;--ok:#4fd27f;--ok-soft:#14301f;--warn:#f2b052;--warn-soft:#352812;--bad:#ff7676;--bad-soft:#3a1717;--sel:#6aa1ff;--sel-soft:#1b2d4f;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-family:var(--font-display);color:var(--accent);text-transform:uppercase;font-size:26px;margin:0;line-height:1}
.who{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field textarea{min-height:80px;resize:vertical}
.code{font-family:var(--font-mono);font-size:22px;letter-spacing:.3em;text-align:center}
.msg{color:var(--bad);font-weight:600;min-height:1.2em;margin:6px 0 0}
.wtabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px;margin-bottom:10px}
.wtabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.wtabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.whd{background:var(--navy);color:var(--navy-fg);border-radius:14px 14px 0 0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.whd h2{margin:0;font-family:var(--font-display);font-size:22px}
.whd small{opacity:.8}
.whd .tot{text-align:right;font-family:var(--font-mono);font-size:22px;font-weight:600}
.whd .tot small{display:block;font-family:var(--font-ui);font-size:12px;font-weight:500}
.days{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;overflow:hidden;margin-bottom:14px}
.day{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.day:first-child{border-top:0}
.day.today{background:var(--sel-soft)}
.dn{font-weight:700;text-transform:capitalize}.dn small{display:block;font-weight:500;color:var(--muted);font-size:12px;text-transform:none}
.dt{font-family:var(--font-mono);font-size:14px}
.dd{font-family:var(--font-mono);font-weight:600}
.nw{white-space:nowrap}
.st{display:inline-block;border-radius:7px;padding:3px 9px;font-weight:700;font-size:13px}
.st.RH{background:var(--surface-2);color:var(--muted)}.st.CP{background:#e1ebfd;color:#1a4fb0}.st.M{background:var(--bad-soft);color:var(--bad)}.st.AB{background:var(--warn-soft);color:var(--warn)}.st.FE{background:var(--ok-soft);color:var(--ok)}.st.FO{background:#e9e1fb;color:#5b30b8}
.tag{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--navy);color:#fff;margin-left:6px}
.hol{color:var(--accent);font-size:11px;font-weight:700;display:block}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
h3{margin:0 0 10px;font-family:var(--font-display);font-size:20px;text-transform:uppercase}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.req{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:3px}
.req:first-of-type{border-top:0}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.pill.attente{background:var(--warn-soft);color:var(--warn)}.pill.acceptée,.pill.traitée{background:var(--ok-soft);color:var(--ok)}.pill.refusée{background:var(--bad-soft);color:var(--bad)}
.mut{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);z-index:9}

/* accueil à cubes, pause QR */
.hero{background:linear-gradient(135deg,#0d2240 0%,#163a6b 60%,#1d4a85 100%);color:#fff;border-radius:22px;padding:18px;position:relative;overflow:hidden;margin-bottom:14px;box-shadow:0 14px 34px -18px rgba(13,34,64,.7)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(232,98,15,.55),rgba(232,98,15,0) 70%)}
.hero>*{position:relative;z-index:1}.hero small{opacity:.8;display:block}.hero small::first-letter{text-transform:uppercase}
.hero h2{font-family:var(--font-display);font-size:30px;margin:2px 0 10px;line-height:1.05}
.hday{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.hday b{font-family:var(--font-mono);font-size:15px;line-height:1.4}.hday .st{background:rgba(255,255,255,.18);color:#fff}
.budget{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:13px}.budget .bar{flex:1;height:8px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}.budget .bar i{display:block;height:100%;background:#43d17a}.budget.over .bar i{background:#ff6b6b}
.cubes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.cube{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;gap:2px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 20px -14px rgba(16,24,40,.25);transition:transform .12s}
.cube:active{transform:scale(.97)}.cube b{font-size:18px}.cube small{color:var(--muted);font-size:13px;line-height:1.25}
.cube .ci{position:absolute;top:14px;left:14px;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;color:#fff}
.cube.c-pz .ci{background:linear-gradient(135deg,#e8620f,#f59a45)}.cube.c-wc .ci{background:linear-gradient(135deg,#1d5fd1,#5b8ff0)}.cube.c-pl .ci{background:linear-gradient(135deg,#0d2240,#2b4f86)}.cube.c-dm .ci{background:linear-gradient(135deg,#6f42c1,#a37ce8)}
.cube.live{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,98,15,.25)}
.cube .cb{position:absolute;top:14px;right:14px;font-family:var(--font-mono);font-weight:700;font-size:13px;background:var(--accent);color:#fff;border-radius:10px;padding:3px 8px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface-2);border-radius:12px;padding:8px 12px;font-weight:600;margin-bottom:12px;cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;background:#0b1626;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));text-align:center;gap:16px}
.ov h2{font-family:var(--font-display);font-size:28px;margin:0}.ov p{margin:0;opacity:.85;max-width:340px}
.cam{position:relative;width:min(78vw,320px);aspect-ratio:1/1;border-radius:26px;overflow:hidden;background:#000}
.cam video{width:100%;height:100%;object-fit:cover}
.cam::after{content:"";position:absolute;inset:16%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .scanl{position:absolute;left:18%;right:18%;height:2px;background:#ff7a2b;top:20%;animation:scan 2s ease-in-out infinite;z-index:2}
@keyframes scan{50%{top:78%}}
.ov .btn{min-width:220px}.ov .btn.ghost{color:#cfd8e6}
.ring{position:relative;width:min(70vw,260px);aspect-ratio:1/1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:4px}
.ring .t b{font-family:var(--font-mono);font-size:46px;line-height:1}.ring .t small{opacity:.8}
.ov.over{background:#3a0d12}.ov.over .ring .t b{color:#ff8a8a}
.pzlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.pzlist span{font-family:var(--font-mono);font-size:12px;background:rgba(255,255,255,.12);border-radius:8px;padding:3px 8px}

.hobj{margin-top:10px;background:rgba(232,98,15,.22);border:1px solid rgba(255,160,100,.35);border-radius:14px;padding:10px 12px}
.hobj b{font-family:var(--font-display);font-size:24px}.hobj small{opacity:.9}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chips span{font-size:12px;border-radius:8px;padding:2px 7px;background:rgba(255,255,255,.14)}
.dobj{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:-4px}
.dobj b{font-family:var(--font-mono);font-size:13px;color:var(--accent)}.dobj span{font-size:12px;border-radius:7px;padding:1px 7px;background:var(--surface-2);color:var(--muted)}
.cube.c-ob .ci{background:linear-gradient(135deg,#e8620f,#c24400)}
.obk{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.obk div{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}.obk small{display:block;color:var(--muted);font-size:12px}.obk b{font-family:var(--font-mono);font-size:17px}
.obk div.po{grid-column:1/-1;background:linear-gradient(135deg,#0d2240,#1d4a85);color:#fff;border:0}.obk div.po small{color:#cfd8e6}.obk div.po b{font-size:28px;font-family:var(--font-display)}
</style></head><body>
<div class="wrap">
  <header><div><h1>Mon planning</h1><div class="who" id="who">Boulanger Flers F890</div></div><button class="btn ghost" id="out" hidden>Déconnexion</button></header>

  <section id="loginV" class="card" hidden>
    <form id="lf">
      <div class="field"><label for="ident">Identifiant</label><input id="ident" autocomplete="username" autocapitalize="none" placeholder="ex. mateo" required></div>
      <div class="field"><label for="code">Code personnel</label><input id="code" class="code" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" required></div>
      <button class="btn primary" type="submit" style="width:100%">Voir mon planning</button>
      <p class="msg" id="lmsg"></p>
    </form>
    <p class="mut">Identifiant et code vous ont été transmis par la direction. En cas d'oubli, demandez un nouveau code.</p>
  </section>

  <section id="mainV" hidden>
   <div id="homeV">
    <div class="hero" id="hero"></div>
    <div class="cubes">
      <button class="cube c-pz" id="cPause"><span class="ci"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9"/></svg></span><b>Pause</b><small>Scanner le QR code</small></button>
      <button class="cube c-wc" id="cWc"><span class="ci"><b style="font-size:17px">WC</b></span><b>Toilettes</b><small>Décompté de la pause</small></button>
      <button class="cube c-pl" data-go="planV"><span class="ci"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18v15H3zM3 10h18M8 5v15M14 5v15"/></svg></span><b>Mon planning</b><small>Semaines publiées</small></button>
      <button class="cube c-ob" data-go="objV"><span class="ci"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg></span><b>Mes objectifs</b><small>PO et services</small></button>
      <button class="cube c-dm" data-go="reqV"><span class="ci"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg></span><b>Demandes</b><small>Congés, échange, erreur</small></button>
    </div>
   </div>
   <div id="planV" hidden>
    <button class="back" data-go="homeV">‹ Accueil</button>
    <div class="wtabs" id="wtabs"></div>
    <div id="week"></div>
   </div>
   <div id="objV" hidden>
    <button class="back" data-go="homeV">‹ Accueil</button>
    <div class="wtabs" id="owtabs"></div>
    <div id="objBox"></div>
   </div>
   <div id="reqV" hidden>
    <button class="back" data-go="homeV">‹ Accueil</button>
    <div class="card">
      <h3>Faire une demande</h3>
      <div class="seg" id="rtype"><button data-t="CP" aria-pressed="true">Congés</button><button data-t="ECHANGE" aria-pressed="false">Échange</button><button data-t="ERREUR" aria-pressed="false">Erreur</button></div>
      <form id="rf">
        <div id="f-cp"><div class="field"><label for="r-from">Du</label><input id="r-from" type="date"></div><div class="field"><label for="r-to">Au (inclus)</label><input id="r-to" type="date"></div></div>
        <div id="f-ech" hidden><div class="field"><label for="r-date">Jour à échanger</label><input id="r-date" type="date"></div><div class="field"><label for="r-avec">Avec</label><select id="r-avec"></select></div></div>
        <div id="f-err" hidden><div class="field"><label for="r-week">Semaine concernée</label><select id="r-week"></select></div></div>
        <div class="field"><label for="r-note">Message</label><textarea id="r-note" placeholder="Précisions pour la direction"></textarea></div>
        <button class="btn primary" type="submit" style="width:100%">Envoyer la demande</button>
      </form>
    </div>
    <div class="card"><h3>Mes demandes</h3><div id="reqs"><p class="empty">Aucune demande pour l'instant.</p></div></div>
   </div>
  </section>
</div>
<div class="ov" id="ovScan" hidden><h2 id="scT">Scannez le QR code</h2><p id="scP">Visez l'affiche « PAUSE » du magasin.</p><div class="cam"><video id="vid" playsinline muted></video><div class="scanl"></div></div><p id="scMsg"></p><button class="btn ghost" id="scCancel">Annuler</button></div>
<div class="ov" id="ovPz" hidden></div>
<p style="text-align:center;color:var(--muted);font-size:12px;margin:0 0 20px">Version du 11/10 15:36</p>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, addDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg = {"apiKey":"AIzaSyDEoDBsdANV89bseWyrIgOryGriPVZLkqo","authDomain":"planning-890.firebaseapp.com","projectId":"planning-890","storageBucket":"planning-890.firebasestorage.app","messagingSenderId":"752375265204","appId":"1:752375265204:web:76652191c3b72f610b64e1"};
const app = initializeApp(cfg), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const MON=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const DAYN=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const LAB={RH:"Repos",CP:"Congés payés",M:"Maladie",FO:"Formation",AB:"Absence",FE:"Férié"};
const fmt = m => Math.floor(m/60)+"h"+pad(m%60);
const frD = s => { const [y,m,d]=s.split("-").map(Number); return d+" "+MON[m-1]; };
function isoWeekId(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=t.getUTCFullYear(); return y+"-W"+pad(Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)); }
const today = (()=>{ const n=new Date(); return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate()); })();
let toastT; const toast = m => { const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3000); };
const st = { emp:null, weeks:[], cur:null, type:"CP", names:[], pz:[], me:"" };

const DOMAIN="equipe-f890.app";
const hashId=decodeURIComponent((location.hash||"").slice(1)).toLowerCase();
try{ const saved=localStorage.getItem("f890-ident"); $("#ident").value=hashId||saved||""; }catch(e){ $("#ident").value=hashId; }
if($("#ident").value) setTimeout(()=>$("#code").focus(),50);

$("#lf").onsubmit=async ev=>{ ev.preventDefault(); const id=$("#ident").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""), code=$("#code").value.trim();
  $("#lmsg").textContent="Connexion…";
  try{ let email=id+"@"+DOMAIN; try{ const l=await getDoc(doc(db,"logins",id)); if(l.exists()) email=l.data().email; }catch(e){}
    await signInWithEmailAndPassword(auth,email,code); try{ localStorage.setItem("f890-ident",id); }catch(e){} $("#lmsg").textContent=""; }
  catch(e){ const c=e&&e.code||""; $("#lmsg").textContent=c.includes("too-many")?"Trop d'essais : réessayez dans quelques minutes.":"Identifiant ou code incorrect."; } };
$("#out").onclick=()=>signOut(auth);

onAuthStateChanged(auth, async u=>{
  if(!u){ $("#loginV").hidden=false; $("#mainV").hidden=true; $("#out").hidden=true; $("#who").textContent="Boulanger Flers F890"; return; }
  try{ const a=await getDoc(doc(db,"access",u.uid)); if(!a.exists()) throw 0; st.emp=a.data().empId; }
  catch(e){ $("#lmsg").textContent="Cet accès n'est plus valable. Demandez un nouveau code à la direction."; await signOut(auth); return; }
  $("#loginV").hidden=true; $("#mainV").hidden=false; $("#out").hidden=false;
  onSnapshot(collection(db,"publies",st.emp,"semaines"), q=>{ st.weeks=q.docs.map(x=>x.data()).sort((a,b)=>a.weekId.localeCompare(b.weekId));
    const cw=isoWeekId(new Date()); if(!st.cur || !st.weeks.find(w=>w.weekId===st.cur)) st.cur=(st.weeks.find(w=>w.weekId>=cw)||st.weeks[st.weeks.length-1]||{}).weekId; renderWeeks(); renderHome(); },
    ()=>{ $("#week").innerHTML='<p class="card empty">Planning indisponible pour le moment.</p>'; });

  onSnapshot(query(collection(db,"demandes"),where("empId","==",st.emp)), q=>{ renderReqs(q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""))); }, ()=>{});
  try{ const n=await getDoc(doc(db,"annuaire","equipe")); st.names=(n.exists()?n.data().list:[])||[]; }catch(e){ st.names=[]; }
  $("#r-avec").innerHTML=st.names.filter(x=>x.id!==st.emp).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join("");
  const me=st.names.find(x=>x.id===st.emp); st.me=me?me.name:st.emp; $("#who").textContent=st.me+" · Boulanger Flers F890";
  onSnapshot(query(collection(db,"pauses"),where("empId","==",st.emp)), q=>{ st.pz=q.docs.map(x=>({id:x.id,...x.data()})).filter(p=>p.day===today); renderHome(); renderPzOv(); }, ()=>{});
  renderHome();
});

function renderWeeks(){
  const cw=isoWeekId(new Date());
  const shown=st.weeks.filter(w=>w.weekId>=prevWeek(cw));
  if(!st.weeks.length){ $("#wtabs").innerHTML=""; $("#week").innerHTML='<p class="card empty">Aucun planning publié pour le moment.</p>'; return; }
  const list=shown.length?shown:st.weeks.slice(-3);
  $("#wtabs").innerHTML=list.map(w=>'<button data-w="'+w.weekId+'" aria-pressed="'+(w.weekId===st.cur)+'">'+(w.weekId===cw?"Cette semaine":"S"+(+w.weekId.split("-W")[1]))+'</button>').join("");
  $("#wtabs").querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ st.cur=b.dataset.w; renderWeeks(); });
  const w=st.weeks.find(x=>x.weekId===st.cur)||list[0]; if(!w) return;
  const d0=w.days[0].date, d6=w.days[6].date;
  $("#week").innerHTML='<div class="whd"><div><h2>Semaine '+(+w.weekId.split("-W")[1])+'</h2><small>'+frD(d0)+' → '+frD(d6)+'</small></div><div class="tot">'+fmt(w.total)+'<small>sur '+String(w.base).replace(".",",")+'h</small></div></div>'+
  '<div class="days">'+w.days.map((x,i)=>{ const timed=x.s==="T"||x.s==="FO"; const ob=w.obj&&w.obj.days&&w.obj.days[i];
    return '<div class="day'+(x.date===today?" today":"")+'"><div class="dn">'+DAYN[i]+'<small>'+frD(x.date)+(x.hol?'<span class="hol">'+esc(x.hol)+'</span>':'')+'</small></div>'+
    '<div class="dt">'+(!x.s?'<span class="mut">—</span>':timed?((x.m1?'<span class="nw">'+x.m1+" – "+x.m2+'</span>':"")+(x.m1&&x.a1?"<br>":"")+(x.a1?'<span class="nw">'+x.a1+" – "+x.a2+'</span>':"")||"Horaires à venir")+(x.tag?'<span class="tag">'+esc(x.tag)+'</span>':'')+(x.s==="FO"?'<span class="tag">Formation</span>':''):'<span class="st '+x.s+'">'+(LAB[x.s]||x.s)+'</span>')+'</div>'+
    '<div class="dd">'+(timed&&x.min?fmt(x.min):"")+'</div>'+(ob?'<div class="dobj"><b>PO '+eur(ob.po)+'</b>'+chipsOf(w.obj.svc,ob.v,true)+'</div>':'')+'</div>'; }).join("")+'</div>'+
  (w.obj?'<div class="card"><b>Objectif PO de la semaine : '+eur(w.obj.week.po)+' HT</b><div class="chips" style="margin-top:8px">'+chipsOf(w.obj.svc,w.obj.week.v).replace(/<span>/g,'<span class="pill attente">')+'</div></div>':'');
  $("#r-week").innerHTML=st.weeks.map(x=>'<option value="'+x.weekId+'"'+(x.weekId===st.cur?" selected":"")+'>Semaine '+(+x.weekId.split("-W")[1])+'</option>').join("");
}
function prevWeek(id){ const [y,w]=id.split("-W").map(Number); const j4=new Date(Date.UTC(y,0,4)); const d=j4.getUTCDay()||7; const mon=new Date(j4); mon.setUTCDate(j4.getUTCDate()-d+1+(w-2)*7+3); return isoWeekId(new Date(mon.getUTCFullYear(),mon.getUTCMonth(),mon.getUTCDate())); }

const TYP={CP:"Congés payés",ECHANGE:"Échange de journée",ERREUR:"Erreur signalée"};
const nameOf = id => (st.names.find(x=>x.id===id)||{}).name||id;
function renderReqs(list){
  $("#reqs").innerHTML = list.length ? list.map(r=>'<div class="req"><div><b>'+TYP[r.type]+'</b> <span class="pill '+esc(r.status)+'">'+(r.status==="attente"?"En attente":esc(r.status))+'</span></div><div class="mut">'+
    (r.type==="CP"?"Du "+frD(r.from)+(r.to&&r.to!==r.from?" au "+frD(r.to):""):r.type==="ECHANGE"?frD(r.date)+" avec "+esc(nameOf(r.avec)):"Semaine "+(+String(r.weekId||"").split("-W")[1]||""))+(r.note?" · « "+esc(r.note)+" »":"")+'</div>'+(r.reponse?'<div><b>Réponse :</b> '+esc(r.reponse)+'</div>':'')+'</div>').join("") : '<p class="empty">Aucune demande pour l\'instant.</p>';
}
$("#rtype").querySelectorAll("button").forEach(b=>b.onclick=()=>{ st.type=b.dataset.t; $("#rtype").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  $("#f-cp").hidden=st.type!=="CP"; $("#f-ech").hidden=st.type!=="ECHANGE"; $("#f-err").hidden=st.type!=="ERREUR"; });
$("#rf").onsubmit=async ev=>{ ev.preventDefault();
  const r={empId:st.emp,type:st.type,note:$("#r-note").value.trim(),status:"attente",createdAt:new Date().toISOString()};
  if(st.type==="CP"){ r.from=$("#r-from").value; r.to=$("#r-to").value||r.from; if(!r.from){ toast("Indiquez la date de début"); return; } if(r.to<r.from){ toast("La date de fin est avant la date de début"); return; } }
  if(st.type==="ECHANGE"){ r.date=$("#r-date").value; r.avec=$("#r-avec").value; if(!r.date||!r.avec){ toast("Indiquez le jour et le collègue"); return; } }
  if(st.type==="ERREUR"){ r.weekId=$("#r-week").value; if(!r.note){ toast("Décrivez l'erreur dans le message"); return; } }
  try{ await addDoc(collection(db,"demandes"),r); toast("Demande envoyée à la direction"); $("#rf").reset(); }catch(e){ toast("Envoi impossible : réessayez"); }
};

/* ---------- navigation ---------- */
const go = v => { ["homeV","planV","reqV","objV"].forEach(k=>$("#"+k).hidden=(k!==v)); if(v==="objV") renderObj(); window.scrollTo({top:0}); };
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));

/* ---------- accueil ---------- */
const BUDGET=600;
const tms = t => !t ? null : t.toMillis ? t.toMillis() : t.seconds!=null ? t.seconds*1000 : Date.parse(t);
const pStart = p => tms(p.startAt) || Date.parse(p.start);
const pEnd = p => p.end ? (tms(p.endAt) || Date.parse(p.end)) : null;
const pDur = (p,now) => Math.max(0, Math.round(((pEnd(p) || now || Date.now()) - pStart(p))/1000));
const mmss = s => { const n=Math.abs(s); return Math.floor(n/60)+":"+pad(n%60); };
const usedToday = now => (st.pz||[]).reduce((t,p)=>t+pDur(p,now),0);
const openPz = () => (st.pz||[]).find(p=>!p.end);
function renderHome(){
  const h=$("#hero"); if(!h||!st.emp) return; const n=new Date();
  const ds=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"][n.getDay()]+" "+n.getDate()+" "+["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"][n.getMonth()];
  let x=null; for(const w of st.weeks){ const f=(w.days||[]).find(d=>d.date===today); if(f){ x=f; break; } }
  const timed=x&&(x.s==="T"||x.s==="FO");
  const used=usedToday(), rem=BUDGET-used, pct=Math.min(100,Math.round(used/BUDGET*100));
  h.innerHTML='<small>'+ds+'</small><h2>Bonjour '+esc((st.me||"").split(" ")[0])+'</h2>'+
    '<div class="hday"><span>Aujourd\'hui</span>'+(!x?'<span class="mut" style="color:#cfd8e6">Planning non publié</span>':timed?'<b>'+(x.m1?x.m1+" – "+x.m2:"")+(x.m1&&x.a1?"<br>":"")+(x.a1?x.a1+" – "+x.a2:"")+'</b>':'<span class="st">'+(LAB[x.s]||x.s)+'</span>')+'</div>'+
    (()=>{ const t=todayObj(); return t?'<div class="hobj"><small>'+(t.today?'Objectif du jour':'Prochain objectif · '+DAYN[t.i]+' '+frD(t.date))+'</small><div><b>'+eur(t.d.po)+'</b> <small>PO HT</small></div><div class="chips">'+chipsOf(t.svc,t.d.v)+'</div></div>':''; })()+
    '<div class="budget'+(rem<0?" over":"")+'"><span>Pause du jour</span><span class="bar"><i style="width:'+pct+'%"></i></span><b>'+(rem<0?"+"+mmss(-rem)+" dépassé":mmss(rem)+" / 10:00")+'</b></div>';
  const o=openPz(); ["cPause","cWc"].forEach(id=>{ const c=$("#"+id); c.classList.toggle("live", !!o && o.type===(id==="cWc"?"wc":"pause")); const old=c.querySelector(".cb"); old&&old.remove();
    if(o && o.type===(id==="cWc"?"wc":"pause")){ const b=document.createElement("span"); b.className="cb"; b.textContent="en cours"; c.appendChild(b); } });
}
setInterval(()=>{ if(!document.hidden && openPz()){ renderHome(); renderPzOv(); } },1000);

/* ---------- lecture du QR code ---------- */
let scanStop=null;
const loadScript = src => new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); });
function loadJsQR(){ if(window.jsQR) return Promise.resolve(); return loadScript("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js").catch(()=>loadScript("https://unpkg.com/jsqr@1.4.0/dist/jsQR.js")); }
function scanQR(title, sub){
  return new Promise(async (resolve,reject)=>{
    $("#scT").textContent=title; $("#scP").textContent=sub; $("#scMsg").textContent=""; $("#ovScan").hidden=false;
    let stream=null, raf=null, done=false; const v=$("#vid");
    const finish=(val,err)=>{ if(done) return; done=true; cancelAnimationFrame(raf); clearTimeout(raf); if(stream) stream.getTracks().forEach(t=>t.stop()); $("#ovScan").hidden=true; scanStop=null; window.__qrScan=null; err?reject(err):resolve(val); };
    scanStop=()=>finish(null,"cancel"); window.__qrScan=t=>finish(t);
    $("#scCancel").onclick=()=>finish(null,"cancel");
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); v.srcObject=stream; await v.play(); }
    catch(e){ $("#scMsg").textContent="Caméra indisponible : autorisez l'accès à la caméra pour ce site dans les réglages du navigateur."; return; }
    let det=null; try{ if("BarcodeDetector" in window){ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes("qr_code")) det=new BarcodeDetector({formats:["qr_code"]}); } }catch(e){}
    if(!det){ try{ await loadJsQR(); }catch(e){ $("#scMsg").textContent="Lecteur QR indisponible : vérifiez la connexion."; return; } }
    const cv=document.createElement("canvas"), cx=cv.getContext("2d",{willReadFrequently:true});
    const tick=async()=>{ if(done) return;
      try{ if(v.readyState>=2){
        if(det){ const r=await det.detect(v); if(r&&r[0]&&r[0].rawValue){ finish(r[0].rawValue); return; } }
        else { const w=v.videoWidth, h=v.videoHeight; const sc=Math.min(1,640/Math.max(w,h)); cv.width=w*sc; cv.height=h*sc; cx.drawImage(v,0,0,cv.width,cv.height); const im=cx.getImageData(0,0,cv.width,cv.height); const c=window.jsQR(im.data,im.width,im.height,{inversionAttempts:"dontInvert"}); if(c&&c.data){ finish(c.data); return; } } } }catch(e){}
      raf=setTimeout(tick,180); };
    tick();
  });
}
const tokenOf = txt => { const m=/^F890-PAUSE:([A-Z0-9]+)$/i.exec(String(txt||"").trim()); return m?m[1].toUpperCase():null; };

/* ---------- pause ---------- */
async function startPz(type){
  const o=openPz(); if(o){ if(o.type!==type) toast("Terminez d'abord la "+(o.type==="wc"?"pause toilettes":"pause")+" en cours"); renderPzOv(true); return; }
  let txt; try{ txt=await scanQR(type==="wc"?"Toilettes":"Pause","Scannez l'affiche « PAUSE » du magasin pour démarrer."); }catch(e){ return; }
  const tk=tokenOf(txt); if(!tk){ toast("Ce QR code n'est pas celui de la pause F890"); return; }
  try{ await addDoc(collection(db,"pauses"),{empId:st.emp, day:today, type, start:new Date().toISOString(), startAt:serverTimestamp(), end:null, qr:tk}); if(navigator.vibrate) navigator.vibrate(60); st.showPz=true; renderPzOv(true); }
  catch(e){ toast(String(e&&e.code||"").includes("permission")?"QR code non reconnu : utilisez l'affiche à jour du magasin":"Enregistrement impossible : vérifiez la connexion"); }
}
async function endPz(noScan){
  const o=openPz(); if(!o) return; let tk=null;
  if(!noScan){ try{ const txt=await scanQR("Fin de pause","Scannez à nouveau l'affiche pour reprendre le travail."); tk=tokenOf(txt); }catch(e){ return; } if(!tk){ toast("Ce QR code n'est pas celui de la pause F890"); return; } }
  try{ await updateDoc(doc(db,"pauses",o.id), noScan?{end:new Date().toISOString(), endAt:serverTimestamp(), noScan:true}:{end:new Date().toISOString(), endAt:serverTimestamp(), endQr:tk});
    const rem=BUDGET-usedToday(); toast(rem<0?"Pause terminée · dépassement de "+mmss(-rem)+" déduit du temps de travail":"Pause terminée · il vous reste "+mmss(rem)); $("#ovPz").hidden=true; }
  catch(e){ toast(String(e&&e.code||"").includes("permission")?"QR code non reconnu":"Enregistrement impossible : réessayez"); }
}
let vibrated=false;
function renderPzOv(open){
  const ov=$("#ovPz"); const o=openPz(); if(!o){ ov.hidden=true; ov.dataset.id=""; return; } if(open||st.showPz){ ov.hidden=false; st.showPz=false; } if(ov.hidden) return;
  const R=46, C=2*Math.PI*R;
  if(ov.dataset.id!==o.id){ ov.dataset.id=o.id;
    ov.innerHTML='<h2>'+(o.type==="wc"?"Toilettes":"Pause")+' en cours</h2><p id="pzSince"></p>'+
      '<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="'+R+'" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="7"/><circle id="pzArc" cx="50" cy="50" r="'+R+'" fill="none" stroke="#43d17a" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'"/></svg>'+
      '<div class="t"><b id="pzRem"></b><small id="pzLbl"></small></div></div><div class="pzlist" id="pzDone"></div>'+
      '<button class="btn primary" id="pzEnd">Reprendre le travail · scanner</button><button class="btn ghost" id="pzNoScan">Je ne peux pas scanner</button><button class="btn ghost" id="pzHide">Réduire</button>';
    $("#pzEnd").onclick=()=>endPz(false);
    $("#pzNoScan").onclick=ev=>{ const b=ev.currentTarget; if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent="Confirmer la fin sans scan (signalée à la direction)"; return; } endPz(true); };
    $("#pzHide").onclick=()=>{ ov.hidden=true; };
  }
  const now=Date.now(), used=usedToday(now), rem=BUDGET-used, cur=pDur(o,now), frac=Math.max(0,Math.min(1,rem/BUDGET));
  if(rem<=0 && !vibrated){ vibrated=true; if(navigator.vibrate) navigator.vibrate([300,150,300]); } if(rem>0) vibrated=false;
  ov.classList.toggle("over",rem<0);
  $("#pzSince").textContent="Depuis "+mmss(cur)+" · démarrée à "+new Date(pStart(o)).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  const arc=$("#pzArc"); arc.setAttribute("stroke-dashoffset",(C*(1-frac)).toFixed(1)); arc.setAttribute("stroke",rem<0?"#ff6b6b":rem<120?"#f2b052":"#43d17a");
  $("#pzRem").textContent=rem<0?"+"+mmss(-rem):mmss(rem);
  $("#pzLbl").textContent=rem<0?"de dépassement · déduit du temps de travail":"restant sur 10:00 aujourd'hui";
  $("#pzDone").innerHTML=(st.pz||[]).filter(p=>p.end).map(p=>'<span>'+(p.type==="wc"?"WC ":"Pause ")+mmss(pDur(p))+'</span>').join("");
}
$("#cPause").onclick=()=>startPz("pause");
$("#cWc").onclick=()=>startPz("wc");

/* ---------- objectifs ---------- */
const eur = n => Math.round(n||0).toLocaleString("fr-FR")+" €";
const sval = (sv,val) => val==null?"–": sv.type==="taux" ? String(Math.round(val*10)/10).replace(".",",")+" %" : sv.type==="volume" ? String(Math.round(val*10)/10).replace(".",",") : String(val).replace(".",",");
const chipsOf = (svc, v, onlyVol) => (svc||[]).filter(m=>v&&v[m.id]!=null&&(!onlyVol||m.type==="volume")).map(m=>'<span>'+esc(m.name)+' '+sval(m,v[m.id])+'</span>').join("");
function todayObj(){ const all=[]; st.weeks.forEach(w=>(w.days||[]).forEach((d,i)=>{ const o=w.obj&&w.obj.days&&w.obj.days[i]; if(o&&d.date>=today) all.push({date:d.date,i,d:o,svc:w.obj.svc}); }));
  all.sort((a,b)=>a.date.localeCompare(b.date)); const t=all[0]; if(!t) return null; t.today=t.date===today; return t; }
function renderObj(){
  const box=$("#objBox"); if(!box) return; const cw=isoWeekId(new Date());
  const list=st.weeks.filter(w=>w.weekId>=prevWeek(cw)&&w.obj); if(!list.length){ $("#owtabs").innerHTML=""; box.innerHTML='<p class="card empty">Pas encore d\'objectifs publiés.</p>'; return; }
  if(!st.ocur||!list.find(w=>w.weekId===st.ocur)) st.ocur=(list.find(w=>w.weekId>=cw)||list[0]).weekId;
  $("#owtabs").innerHTML=list.map(w=>'<button data-ow="'+w.weekId+'" aria-pressed="'+(w.weekId===st.ocur)+'">'+(w.weekId===cw?"Cette semaine":"S"+(+w.weekId.split("-W")[1]))+'</button>').join("");
  $("#owtabs").querySelectorAll("[data-ow]").forEach(b=>b.onclick=()=>{ st.ocur=b.dataset.ow; renderObj(); });
  const w=list.find(x=>x.weekId===st.ocur); const O=w.obj;
  box.innerHTML='<div class="card"><h3>Semaine '+(+w.weekId.split("-W")[1])+'</h3><div class="obk"><div class="po"><small>PO de la semaine (HT)</small><b>'+eur(O.week.po)+'</b></div>'+
    (O.svc||[]).filter(m=>O.week.v[m.id]!=null).map(m=>'<div><small>'+esc(m.name)+'</small><b>'+sval(m,O.week.v[m.id])+'</b></div>').join("")+'</div></div>'+
    '<div class="days">'+w.days.map((x,i)=>{ const o=O.days[i]; if(!o) return ''; return '<div class="day'+(x.date===today?" today":"")+'"><div class="dn">'+DAYN[i]+'<small>'+frD(x.date)+'</small></div><div class="dt"><b>'+eur(o.po)+'</b> <span class="mut">PO HT</span></div><div></div><div class="dobj">'+chipsOf(O.svc,o.v,true)+'</div></div>'; }).join("")+'</div>';
}
</script>
