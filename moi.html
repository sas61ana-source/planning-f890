<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon planning F890</title>
<meta name="theme-color" content="#0d2240"><link rel="manifest" href="manifest-moi.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Espace collaborateur : une colonne, pensée pour le téléphone. Orange enseigne, bleu nuit. */
:root{--bg:#f4f6f9;--surface:#fff;--surface-2:#eef1f6;--line:#d8dee8;--fg:#16202e;--muted:#5d6b7e;--navy:#0d2240;--navy-fg:#fff;--accent:#e8620f;--accent-fg:#fff;--ok:#17803d;--ok-soft:#dcf3e4;--warn:#b45309;--warn-soft:#fdf0d5;--bad:#c42222;--bad-soft:#fde4e4;--sel:#1d5fd1;--sel-soft:#e3ecfc;
--font-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--font-display:"Barlow Condensed","Barlow",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c121c;--surface:#131b28;--surface-2:#1a2434;--line:#2a3649;--fg:#e6ebf3;--muted:#93a1b5;--navy:#1b3560;--accent:#ff7a2b;--accent-fg:#1a0d04;--ok:#4fd27f;--ok-soft:#14301f;--warn:#f2b052;--warn-soft:#352812;--bad:#ff7676;--bad-soft:#3a1717;--sel:#6aa1ff;--sel-soft:#1b2d4f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c121c;--surface:#131b28;--surface-2:#1a2434;--line:#2a3649;--fg:#e6ebf3;--muted:#93a1b5;--navy:#1b3560;--accent:#ff7a2b;--accent-fg:#1a0d04;--ok:#4fd27f;--ok-soft:#14301f;--warn:#f2b052;--warn-soft:#352812;--bad:#ff7676;--bad-soft:#3a1717;--sel:#6aa1ff;--sel-soft:#1b2d4f;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-family:var(--font-display);color:var(--accent);text-transform:uppercase;font-size:26px;margin:0;line-height:1}
.who{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field textarea{min-height:80px;resize:vertical}
.code{font-family:var(--font-mono);font-size:22px;letter-spacing:.3em;text-align:center}
.msg{color:var(--bad);font-weight:600;min-height:1.2em;margin:6px 0 0}
.wtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.wtabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.wtabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.whd{background:var(--navy);color:var(--navy-fg);border-radius:14px 14px 0 0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.whd h2{margin:0;font-family:var(--font-display);font-size:22px}
.whd small{opacity:.8}
.whd .tot{text-align:right;font-family:var(--font-mono);font-size:22px;font-weight:600}
.whd .tot small{display:block;font-family:var(--font-ui);font-size:12px;font-weight:500}
.days{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;overflow:hidden;margin-bottom:14px}
.day{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.day:first-child{border-top:0}
.day.today{background:var(--sel-soft)}
.dn{font-weight:700;text-transform:capitalize}.dn small{display:block;font-weight:500;color:var(--muted);font-size:12px;text-transform:none}
.dt{font-family:var(--font-mono);font-size:14px}
.dd{font-family:var(--font-mono);font-weight:600}
.nw{white-space:nowrap}
.st{display:inline-block;border-radius:7px;padding:3px 9px;font-weight:700;font-size:13px}
.st.RH{background:var(--surface-2);color:var(--muted)}.st.CP{background:#e1ebfd;color:#1a4fb0}.st.M{background:var(--bad-soft);color:var(--bad)}.st.AB{background:var(--warn-soft);color:var(--warn)}.st.FE{background:var(--ok-soft);color:var(--ok)}.st.FO{background:#e9e1fb;color:#5b30b8}
.tag{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--navy);color:#fff;margin-left:6px}
.hol{color:var(--accent);font-size:11px;font-weight:700;display:block}
.empty{color:var(--muted);text-align:center;padding:24px 10px}
h3{margin:0 0 10px;font-family:var(--font-display);font-size:20px;text-transform:uppercase}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.req{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:3px}
.req:first-of-type{border-top:0}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.pill.attente{background:var(--warn-soft);color:var(--warn)}.pill.acceptée,.pill.traitée{background:var(--ok-soft);color:var(--ok)}.pill.refusée{background:var(--bad-soft);color:var(--bad)}
.mut{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);z-index:9}
</style></head><body>
<div class="wrap">
  <header><div><h1>Mon planning</h1><div class="who" id="who">Boulanger Flers F890</div></div><button class="btn ghost" id="out" hidden>Déconnexion</button></header>

  <section id="loginV" class="card" hidden>
    <form id="lf">
      <div class="field"><label for="ident">Identifiant</label><input id="ident" autocomplete="username" autocapitalize="none" placeholder="ex. mateo" required></div>
      <div class="field"><label for="code">Code personnel</label><input id="code" class="code" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" required></div>
      <button class="btn primary" type="submit" style="width:100%">Voir mon planning</button>
      <p class="msg" id="lmsg"></p>
    </form>
    <p class="mut">Identifiant et code vous ont été transmis par la direction. En cas d'oubli, demandez un nouveau code.</p>
  </section>

  <section id="mainV" hidden>
    <div class="wtabs" id="wtabs"></div>
    <div id="week"></div>
    <div class="card">
      <h3>Faire une demande</h3>
      <div class="seg" id="rtype"><button data-t="CP" aria-pressed="true">Congés</button><button data-t="ECHANGE" aria-pressed="false">Échange</button><button data-t="ERREUR" aria-pressed="false">Erreur</button></div>
      <form id="rf">
        <div id="f-cp"><div class="field"><label for="r-from">Du</label><input id="r-from" type="date"></div><div class="field"><label for="r-to">Au (inclus)</label><input id="r-to" type="date"></div></div>
        <div id="f-ech" hidden><div class="field"><label for="r-date">Jour à échanger</label><input id="r-date" type="date"></div><div class="field"><label for="r-avec">Avec</label><select id="r-avec"></select></div></div>
        <div id="f-err" hidden><div class="field"><label for="r-week">Semaine concernée</label><select id="r-week"></select></div></div>
        <div class="field"><label for="r-note">Message</label><textarea id="r-note" placeholder="Précisions pour la direction"></textarea></div>
        <button class="btn primary" type="submit" style="width:100%">Envoyer la demande</button>
      </form>
    </div>
    <div class="card"><h3>Mes demandes</h3><div id="reqs"><p class="empty">Aucune demande pour l'instant.</p></div></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg = {"apiKey":"AIzaSyDEoDBsdANV89bseWyrIgOryGriPVZLkqo","authDomain":"planning-890.firebaseapp.com","projectId":"planning-890","storageBucket":"planning-890.firebasestorage.app","messagingSenderId":"752375265204","appId":"1:752375265204:web:76652191c3b72f610b64e1"};
const app = initializeApp(cfg), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const MON=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const DAYN=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const LAB={RH:"Repos",CP:"Congés payés",M:"Maladie",FO:"Formation",AB:"Absence",FE:"Férié"};
const fmt = m => Math.floor(m/60)+"h"+pad(m%60);
const frD = s => { const [y,m,d]=s.split("-").map(Number); return d+" "+MON[m-1]; };
function isoWeekId(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=t.getUTCFullYear(); return y+"-W"+pad(Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)); }
const today = (()=>{ const n=new Date(); return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate()); })();
let toastT; const toast = m => { const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3000); };
const st = { emp:null, weeks:[], cur:null, type:"CP", names:[] };

const DOMAIN="equipe-f890.app";
const hashId=decodeURIComponent((location.hash||"").slice(1)).toLowerCase();
try{ const saved=localStorage.getItem("f890-ident"); $("#ident").value=hashId||saved||""; }catch(e){ $("#ident").value=hashId; }
if($("#ident").value) setTimeout(()=>$("#code").focus(),50);

$("#lf").onsubmit=async ev=>{ ev.preventDefault(); const id=$("#ident").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""), code=$("#code").value.trim();
  $("#lmsg").textContent="Connexion…";
  try{ let email=id+"@"+DOMAIN; try{ const l=await getDoc(doc(db,"logins",id)); if(l.exists()) email=l.data().email; }catch(e){}
    await signInWithEmailAndPassword(auth,email,code); try{ localStorage.setItem("f890-ident",id); }catch(e){} $("#lmsg").textContent=""; }
  catch(e){ const c=e&&e.code||""; $("#lmsg").textContent=c.includes("too-many")?"Trop d'essais : réessayez dans quelques minutes.":"Identifiant ou code incorrect."; } };
$("#out").onclick=()=>signOut(auth);

onAuthStateChanged(auth, async u=>{
  if(!u){ $("#loginV").hidden=false; $("#mainV").hidden=true; $("#out").hidden=true; $("#who").textContent="Boulanger Flers F890"; return; }
  try{ const a=await getDoc(doc(db,"access",u.uid)); if(!a.exists()) throw 0; st.emp=a.data().empId; }
  catch(e){ $("#lmsg").textContent="Cet accès n'est plus valable. Demandez un nouveau code à la direction."; await signOut(auth); return; }
  $("#loginV").hidden=true; $("#mainV").hidden=false; $("#out").hidden=false;
  onSnapshot(collection(db,"publies",st.emp,"semaines"), q=>{ st.weeks=q.docs.map(x=>x.data()).sort((a,b)=>a.weekId.localeCompare(b.weekId));
    const cw=isoWeekId(new Date()); if(!st.cur || !st.weeks.find(w=>w.weekId===st.cur)) st.cur=(st.weeks.find(w=>w.weekId>=cw)||st.weeks[st.weeks.length-1]||{}).weekId; renderWeeks(); },
    ()=>{ $("#week").innerHTML='<p class="card empty">Planning indisponible pour le moment.</p>'; });
  onSnapshot(query(collection(db,"demandes"),where("empId","==",st.emp)), q=>{ renderReqs(q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""))); }, ()=>{});
  try{ const n=await getDoc(doc(db,"annuaire","equipe")); st.names=(n.exists()?n.data().list:[])||[]; }catch(e){ st.names=[]; }
  $("#r-avec").innerHTML=st.names.filter(x=>x.id!==st.emp).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join("");
  const me=st.names.find(x=>x.id===st.emp); $("#who").textContent=(me?me.name:st.emp)+" · Boulanger Flers F890";
});

function renderWeeks(){
  const cw=isoWeekId(new Date());
  const shown=st.weeks.filter(w=>w.weekId>=prevWeek(cw));
  if(!st.weeks.length){ $("#wtabs").innerHTML=""; $("#week").innerHTML='<p class="card empty">Aucun planning publié pour le moment.</p>'; return; }
  const list=shown.length?shown:st.weeks.slice(-3);
  $("#wtabs").innerHTML=list.map(w=>'<button data-w="'+w.weekId+'" aria-pressed="'+(w.weekId===st.cur)+'">'+(w.weekId===cw?"Cette semaine":"S"+(+w.weekId.split("-W")[1]))+'</button>').join("");
  $("#wtabs").querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ st.cur=b.dataset.w; renderWeeks(); });
  const w=st.weeks.find(x=>x.weekId===st.cur)||list[0]; if(!w) return;
  const d0=w.days[0].date, d6=w.days[6].date;
  $("#week").innerHTML='<div class="whd"><div><h2>Semaine '+(+w.weekId.split("-W")[1])+'</h2><small>'+frD(d0)+' → '+frD(d6)+'</small></div><div class="tot">'+fmt(w.total)+'<small>sur '+String(w.base).replace(".",",")+'h</small></div></div>'+
  '<div class="days">'+w.days.map((x,i)=>{ const timed=x.s==="T"||x.s==="FO";
    return '<div class="day'+(x.date===today?" today":"")+'"><div class="dn">'+DAYN[i]+'<small>'+frD(x.date)+(x.hol?'<span class="hol">'+esc(x.hol)+'</span>':'')+'</small></div>'+
    '<div class="dt">'+(!x.s?'<span class="mut">—</span>':timed?((x.m1?'<span class="nw">'+x.m1+" – "+x.m2+'</span>':"")+(x.m1&&x.a1?"<br>":"")+(x.a1?'<span class="nw">'+x.a1+" – "+x.a2+'</span>':"")||"Horaires à venir")+(x.tag?'<span class="tag">'+esc(x.tag)+'</span>':'')+(x.s==="FO"?'<span class="tag">Formation</span>':''):'<span class="st '+x.s+'">'+(LAB[x.s]||x.s)+'</span>')+'</div>'+
    '<div class="dd">'+(timed&&x.min?fmt(x.min):"")+'</div></div>'; }).join("")+'</div>';
  $("#r-week").innerHTML=st.weeks.map(x=>'<option value="'+x.weekId+'"'+(x.weekId===st.cur?" selected":"")+'>Semaine '+(+x.weekId.split("-W")[1])+'</option>').join("");
}
function prevWeek(id){ const [y,w]=id.split("-W").map(Number); const j4=new Date(Date.UTC(y,0,4)); const d=j4.getUTCDay()||7; const mon=new Date(j4); mon.setUTCDate(j4.getUTCDate()-d+1+(w-2)*7+3); return isoWeekId(new Date(mon.getUTCFullYear(),mon.getUTCMonth(),mon.getUTCDate())); }

const TYP={CP:"Congés payés",ECHANGE:"Échange de journée",ERREUR:"Erreur signalée"};
const nameOf = id => (st.names.find(x=>x.id===id)||{}).name||id;
function renderReqs(list){
  $("#reqs").innerHTML = list.length ? list.map(r=>'<div class="req"><div><b>'+TYP[r.type]+'</b> <span class="pill '+esc(r.status)+'">'+(r.status==="attente"?"En attente":esc(r.status))+'</span></div><div class="mut">'+
    (r.type==="CP"?"Du "+frD(r.from)+(r.to&&r.to!==r.from?" au "+frD(r.to):""):r.type==="ECHANGE"?frD(r.date)+" avec "+esc(nameOf(r.avec)):"Semaine "+(+String(r.weekId||"").split("-W")[1]||""))+(r.note?" · « "+esc(r.note)+" »":"")+'</div>'+(r.reponse?'<div><b>Réponse :</b> '+esc(r.reponse)+'</div>':'')+'</div>').join("") : '<p class="empty">Aucune demande pour l\'instant.</p>';
}
$("#rtype").querySelectorAll("button").forEach(b=>b.onclick=()=>{ st.type=b.dataset.t; $("#rtype").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  $("#f-cp").hidden=st.type!=="CP"; $("#f-ech").hidden=st.type!=="ECHANGE"; $("#f-err").hidden=st.type!=="ERREUR"; });
$("#rf").onsubmit=async ev=>{ ev.preventDefault();
  const r={empId:st.emp,type:st.type,note:$("#r-note").value.trim(),status:"attente",createdAt:new Date().toISOString()};
  if(st.type==="CP"){ r.from=$("#r-from").value; r.to=$("#r-to").value||r.from; if(!r.from){ toast("Indiquez la date de début"); return; } if(r.to<r.from){ toast("La date de fin est avant la date de début"); return; } }
  if(st.type==="ECHANGE"){ r.date=$("#r-date").value; r.avec=$("#r-avec").value; if(!r.date||!r.avec){ toast("Indiquez le jour et le collègue"); return; } }
  if(st.type==="ERREUR"){ r.weekId=$("#r-week").value; if(!r.note){ toast("Décrivez l'erreur dans le message"); return; } }
  try{ await addDoc(collection(db,"demandes"),r); toast("Demande envoyée à la direction"); $("#rf").reset(); }catch(e){ toast("Envoi impossible : réessayez"); }
};
</script>
</body></html>
